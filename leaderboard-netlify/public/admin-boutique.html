<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXECUBE — Admin Boutique</title>
<style>
  :root{ --bg:#060907; --panel:#0d1210; --line:#1d2b1e; --green:#8cff2e; --amber:#f2b90c; --text:#eef4ec; --mut:#7b8a7d; }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:32px 24px 80px}
  h1{font-size:20px;margin-bottom:4px}
  h1 .g{color:var(--green)}
  .sous{color:var(--mut);font-size:12px;margin-bottom:24px}
  .connexion{max-width:340px;margin:80px auto;text-align:center}
  .connexion input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:8px;font-family:inherit;font-size:13px;margin-bottom:10px}
  .connexion button{width:100%;background:none;border:1px solid var(--green);color:var(--green);
    padding:10px;border-radius:8px;font-family:inherit;cursor:pointer;font-size:13px}
  .ligne{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .ligne img{width:52px;height:78px;object-fit:cover;border-radius:5px;flex-shrink:0}
  .ligneNom{flex:1;font-size:13px;font-weight:700}
  .ligneCtrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  select,input[type=number]{background:#12161c;border:1px solid var(--line);color:var(--text);
    padding:6px 8px;border-radius:6px;font-family:inherit;font-size:11px}
  input[type=number]{width:70px}
  .btnSauver{background:none;border:1px solid var(--green);color:var(--green);padding:6px 12px;
    border-radius:6px;font-family:inherit;cursor:pointer;font-size:11px}
  .btnSauver:hover{background:rgba(140,255,46,.1)}
  .etat{font-size:10px;color:var(--mut);min-width:70px}
  .etat.ok{color:var(--green)}
  .etat.err{color:#e05a5a}
  .champPrix{display:none;gap:8px;align-items:center}
  .champPrix.actif{display:flex}
</style></head>
<body>

<div class="connexion" id="ecranConnexion">
  <h1>AXECUBE — Admin <span class="g">Boutique</span></h1>
  <p class="sous">Accès réservé.</p>
  <input type="password" id="motDePasse" placeholder="Mot de passe admin">
  <button onclick="connecter()">Entrer</button>
  <div class="sous" id="erreurConnexion" style="color:#e05a5a"></div>
</div>

<div class="wrap" id="ecranAdmin" style="display:none">
  <h1>AXECUBE — Admin <span class="g">Boutique</span></h1>
  <p class="sous">Définis le statut de chaque pièce de la collection Premium. Les changements sont visibles immédiatement sur la page boutique et dans AXECUBE (bouton 🎁).</p>
  <div id="liste"></div>
</div>

let motDePasse = '';

function connecter(){
  motDePasse = document.getElementById('motDePasse').value;
  if(!motDePasse){ document.getElementById('erreurConnexion').textContent = 'Mot de passe requis.'; return; }
  document.getElementById('ecranConnexion').style.display='none';
  document.getElementById('ecranAdmin').style.display='block';
  construireListe();
}

function construireListe(){
  const liste = document.getElementById('liste');
  liste.innerHTML = ITEMS.map(it => `
    <div class="ligne" data-id="${it.id}">
      <img src="${it.img}" alt="">
      <div class="ligneNom">${it.nom}</div>
      <div class="ligneCtrl">
        <select class="selStatut" onchange="basculerChampPrix('${it.id}')">
          <option value="a_venir">À venir</option>
          <option value="gratuit">Gratuit</option>
          <option value="achat">Achat</option>
        </select>
        <div class="champPrix" id="prix-${it.id}">
          <input type="number" class="inpPrix" placeholder="Prix €" min="0">
          <input type="number" class="inpRemise" placeholder="Remise %" min="0" max="90">
        </div>
        <button class="btnSauver" onclick="sauvegarder('${it.id}')">Enregistrer</button>
        <span class="etat" id="etat-${it.id}"></span>
      </div>
    </div>
  `).join('');
}

function basculerChampPrix(id){
  const ligne = document.querySelector(`.ligne[data-id="${id}"]`);
  const statut = ligne.querySelector('.selStatut').value;
  document.getElementById('prix-'+id).classList.toggle('actif', statut==='achat');
}

async function sauvegarder(id){
  const ligne = document.querySelector(`.ligne[data-id="${id}"]`);
  const statut = ligne.querySelector('.selStatut').value;
  const prix = ligne.querySelector('.inpPrix').value;
  const remise = ligne.querySelector('.inpRemise').value;
  const etatEl = document.getElementById('etat-'+id);
  etatEl.textContent = '...'; etatEl.className='etat';
  try{
    const r = await fetch('/.netlify/functions/admin-offres', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ motDePasse, itemId:id, statut, prix, remise })
    });
    const j = await r.json();
    if(j.ok){ etatEl.textContent='✅ Enregistré'; etatEl.className='etat ok'; }
    else { etatEl.textContent='❌ '+(j.erreur||'erreur'); etatEl.className='etat err'; }
  }catch(e){
    etatEl.textContent='❌ Erreur réseau'; etatEl.className='etat err';
  }
}
</script>
